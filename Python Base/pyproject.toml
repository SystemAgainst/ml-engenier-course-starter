[project]
name = "python-syntax-refresh"
version = "0.1.0"
description = "One-hour Python syntax refresher"
requires-python = ">=3.12,<3.13"
dependencies = ["requests (>=2.34.2,<3.0.0)", "python-dotenv (>=1.2.4,<2.0.0)", "pytelegrambotapi (>=4.37.0,<5.0.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
mypy = ">=1.13,<1.20"
ruff = "^0.8"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Кириллица в учебных комментариях намеренная.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
explicit_package_bases = true
exclude = ['^\.venv/']
